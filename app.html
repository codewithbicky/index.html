<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bicky Chat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:#0d1117;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.chat-box{
    width:380px;
    height:650px;
    background:#161b22;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 20px #00ff88;
}
.header{
    background:#00ff88;
    color:#000;
    text-align:center;
    padding:15px;
    font-size:22px;
    font-weight:bold;
}
.messages{
    height:500px;
    overflow-y:auto;
    padding:15px;
}
.msg{
    background:#238636;
    color:#fff;
    padding:10px 15px;
    border-radius:15px;
    width:fit-content;
    margin:10px 0;
}
.me{
    background:#00ff88;
    color:#000;
    margin-left:auto;
}
.input-area{
    display:flex;
    padding:10px;
    background:#21262d;
}
input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:20px;
    outline:none;
}
button{
    margin-left:10px;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    background:#00ff88;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="chat-box">

<div class="header">
💬 Bicky Chat
</div>

<div class="messages" id="chat">
<div class="msg">Hello 👋</div>
<div class="msg me">Hi!</div>
</div>

<div class="input-area">
<input type="text" id="text" placeholder="Type a message...">
<button onclick="send()">Send</button>
</div>

</div>

<script>
function send(){
let text=document.getElementById("text");
let chat=document.getElementById("chat");

if(text.value.trim()!=""){
let div=document.createElement("div");
div.className="msg me";
div.innerText=text.value;
chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

text.value="";
}
}
</script>

</body>
</html>
